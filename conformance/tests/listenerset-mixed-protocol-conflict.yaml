apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-listenerset-conflicts
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: control.example.com
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
    - name: https
      port: 8443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
      tls:
        certificateRefs:
          - name: tls-validity-checks-certificate
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: listenerset-mixed-protocol-conflict
  namespace: gateway-conformance-infra
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-listenerset-conflicts
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      hostname: listenerset-control.example.com
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
    - name: tls
      port: 8443
      protocol: TLS
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: TLSRoute
      tls:
        mode: Passthrough
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: listenerset-mixed-protocol-control
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: gateway-listenerset-conflicts
      sectionName: http
  hostnames:
    - control.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /control
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: listenerset-mixed-protocol-https
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: gateway-listenerset-conflicts
      sectionName: https
  hostnames:
    - https.example.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /https
      backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: listenerset-mixed-protocol-tls
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: listenerset-mixed-protocol-conflict
      sectionName: tls
  hostnames:
    - abc.example.com
  rules:
    - backendRefs:
        - name: tcp-backend
          port: 8443