apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-only-invalid-route-kind
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: InvalidRoute
    - name: control
      port: 8080
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-only-invalid-route-kind-control
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: gateway-only-invalid-route-kind
      sectionName: control
  hostnames:
    - invalid-route-kind-control.example.com
  rules:
    - backendRefs:
        - name: infra-backend-v1
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-supported-and-invalid-route-kind
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: InvalidRoute
          - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-supported-and-invalid-route-kind-control
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: gateway-supported-and-invalid-route-kind
      sectionName: http
  hostnames:
    - invalid-route-kind.example.com
  rules:
    - backendRefs:
        - name: infra-backend-v1
          port: 8080
